services:
  db:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: mi-mariadb
    container_name: mi-mariadb-compose
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    env_file: 
      - entorno.env
    restart: always
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "9090:80"
    depends_on:
      - db
    env_file: 
      - phpmyadmin.env
    restart: always
volumes:
  db_data:
